name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      # Deterministic placeholder so `docker compose config` does not warn
      # about an unset variable. The real secret lives only in .env.
      SERVER_SECRET_KEY: ci-placeholder
    steps:
      - uses: actions/checkout@v4

      - name: Validate docker-compose file
        run: docker compose config --quiet

      - name: Syntax-check JavaScript
        run: |
          for f in $(find assets -name '*.js'); do
            echo "node --check $f"
            node --check "$f"
          done

      - name: Validate JSON files
        run: |
          for f in $(find . -path ./.git -prune -o -name '*.json' -print); do
            echo "python -m json.tool $f"
            python3 -m json.tool "$f" > /dev/null
          done

      - name: Validate YAML files
        run: |
          python3 -c "
          import glob, sys, yaml
          files = glob.glob('config/*.yml') + glob.glob('*.yml')
          for f in files:
              with open(f) as fh:
                  yaml.safe_load(fh)
              print('yaml ok', f)
          "
